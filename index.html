  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>النظام العصبي للقرآن</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a1a;font-family:'Tajawal',sans-serif;color:#fff;overflow:hidden;height:100vh}
#app{display:flex;flex-direction:column;height:100vh}

#header{background:linear-gradient(90deg,#0a0a1a,#1a1a3a,#0a0a1a);padding:12px;text-align:center;border-bottom:1px solid #00ffcc33;position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px}
#header h1{font-size:16px;color:#ffcc00;flex:1;text-align:center}
#header h1 span{color:#00ffcc}
.header-btns{display:flex;gap:6px}
.hbtn{background:rgba(0,255,204,0.15);border:1px solid #00ffcc;color:#00ffcc;padding:6px 10px;border-radius:8px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;font-size:11px;white-space:nowrap}
.hbtn.gold{background:rgba(255,204,0,0.15);border-color:#ffcc00;color:#ffcc00}
.hbtn.purple{background:rgba(170,0,255,0.15);border-color:#aa00ff;color:#aa00ff}

#main{display:flex;flex:1;overflow:hidden}
#sidebar{width:280px;background:rgba(10,10,30,0.95);border-left:1px solid #00ffcc33;overflow-y:auto;padding:12px;transition:margin .3s}
#sidebar.hidden{margin-right:-280px}
#sidebar h2{color:#ffcc00;font-size:13px;margin-bottom:8px;text-align:center}
.search-box{display:flex;gap:4px;margin-bottom:10px}
.search-box input{flex:1;padding:8px;border-radius:8px;border:1px solid #00ffcc55;background:rgba(0,255,204,0.05);color:#fff;font-family:'Tajawal',sans-serif;outline:none;font-size:12px}
.search-box button{padding:8px 12px;border-radius:8px;border:none;background:#00ffcc;color:#0a0a1a;font-weight:700;cursor:pointer;font-size:12px}

.side-tabs{display:flex;gap:4px;margin-bottom:10px}
.side-tab{flex:1;padding:6px;border-radius:6px;background:rgba(255,255,255,0.05);border:1px solid transparent;color:#aaa;font-size:11px;text-align:center;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700}
.side-tab.active{background:rgba(0,255,204,0.15);border-color:#00ffcc;color:#00ffcc}

.surah-item{padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.03);border-right:3px solid;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;transition:.2s}
.surah-item:hover{background:rgba(255,255,255,0.08)}
.surah-item.fam1{border-color:#00ffcc}
.surah-item.fam2{border-color:#00aaff}
.surah-item.fam3{border-color:#ffcc00}
.surah-item .num{color:#ffcc00;font-weight:700}
.surah-item .ayat{color:#888;font-size:10px}
.surah-item .fav{color:#ffcc00;cursor:pointer;font-size:13px;padding:0 4px}
.surah-item.fav-active{background:rgba(255,204,0,0.1)}

#content{flex:1;position:relative;overflow:hidden}
#canvas-container{width:100%;height:100%}

#infoPanel{position:absolute;top:15px;left:15px;background:rgba(0,0,0,0.95);border:2px solid #00ffcc;border-radius:15px;padding:18px;width:400px;max-width:calc(100% - 30px);max-height:85vh;overflow-y:auto;display:none;z-index:100}
#infoPanel h2{color:#ffcc00;font-size:16px;margin-bottom:12px;border-bottom:1px solid #00ffcc33;padding-bottom:8px}
#infoPanel .info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ffffff11;font-size:13px}
#infoPanel .label{color:#aaa}
#infoPanel .value{color:#00ffcc;font-weight:700}
#infoPanel .family-tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
#infoPanel .close-btn{position:absolute;top:8px;left:8px;background:rgba(255,0,0,0.2);border:1px solid #ff3333;color:#ff3333;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px}
#infoPanel .axis-box{background:linear-gradient(90deg,rgba(0,255,204,0.15),rgba(255,204,0,0.15));border:1px solid #00ffcc;border-radius:10px;padding:10px;margin:8px 0;text-align:center}
#infoPanel .axis-box .axis-label{color:#ffcc00;font-size:10px;display:block;margin-bottom:4px}
#infoPanel .axis-box .axis-value{color:#00ffcc;font-size:14px;font-weight:900}
#infoPanel .section-title{color:#ffcc00;font-size:12px;font-weight:900;margin:14px 0 8px;padding-bottom:5px;border-bottom:1px dashed #ffcc0044}
#infoPanel .section-title.sec2{color:#00aaff;border-color:#00aaff44}
#infoPanel .rel-hint{font-size:10px;color:#888;margin-bottom:6px}
#infoPanel .rel-list{display:flex;flex-wrap:wrap;gap:5px}
#infoPanel .rel-btn{background:rgba(0,255,204,0.1);border:1px solid #00ffcc55;padding:5px 10px;border-radius:15px;font-size:11px;cursor:pointer;color:#00ffcc;font-weight:700}
#infoPanel .rel-btn.blue{background:rgba(0,170,255,0.1);border-color:#00aaff55;color:#00aaff}
#infoPanel .topic-list{display:flex;flex-wrap:wrap;gap:5px}
#infoPanel .topic-item{background:rgba(255,204,0,0.1);border:1px solid #ffcc0055;padding:4px 10px;border-radius:12px;font-size:10px;color:#ffcc00;font-weight:700;cursor:pointer}

#ayahCard{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.5) rotate(-5deg);background:linear-gradient(135deg,#0a0a1e,#1a1a3a);border:2px solid #ffcc00;border-radius:20px;padding:25px;width:560px;max-width:92%;max-height:80vh;overflow-y:auto;display:none;z-index:1000;box-shadow:0 20px 60px rgba(255,204,0,0.35);opacity:0;transition:all .4s cubic-bezier(0.34,1.56,0.64,1)}
#ayahCard.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0deg)}
#ayahCard .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #ffcc0033}
#ayahCard .card-title{color:#ffcc00;font-size:18px;font-weight:900}
#ayahCard .card-close{background:rgba(255,0,0,0.2);border:1px solid #ff3333;color:#ff3333;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}
#ayahCard .relation-tag{display:inline-block;background:rgba(0,255,204,0.15);border:1px solid #00ffcc55;color:#00ffcc;font-size:11px;padding:4px 12px;border-radius:15px;margin-bottom:12px;font-weight:700}
#ayahCard .relation-tag.blue{background:rgba(0,170,255,0.15);border-color:#00aaff55;color:#00aaff}
#ayahCard .ayah-verse{background:rgba(255,204,0,0.08);border-right:4px solid #ffcc00;padding:20px 15px;border-radius:12px;margin:12px 0}
#ayahCard .ayah-text{color:#fff;font-size:18px;line-height:2.1;text-align:center}
#ayahCard .ayah-source{color:#ffcc00;font-size:12px;text-align:center;margin-top:12px;font-weight:700;display:block}

#statsBar{position:absolute;bottom:15px;left:15px;display:flex;gap:10px;z-index:50;flex-wrap:wrap}
.stat-box{background:rgba(0,0,0,0.85);border:2px solid;border-radius:10px;padding:8px 12px;text-align:center;cursor:pointer}
.stat-box .num{font-size:20px;font-weight:900}
.stat-box .label{font-size:10px;color:#888}
.stat-box.c1{border-color:#00ffcc}.stat-box.c1 .num{color:#00ffcc}
.stat-box.c2{border-color:#00aaff}.stat-box.c2 .num{color:#00aaff}
.stat-box.c3{border-color:#ffcc00}.stat-box.c3 .num{color:#ffcc00}

#toolbar{position:absolute;bottom:15px;right:15px;display:flex;gap:8px;z-index:50;flex-wrap:wrap;max-width:60%}
.tool-btn{background:rgba(0,0,0,0.85);border:2px solid #00ffcc;color:#00ffcc;padding:8px 12px;border-radius:12px;cursor:pointer;font-family:'Tajawal',sans-serif;font-weight:700;font-size:11px;display:flex;align-items:center;gap:4px;transition:.2s}
.tool-btn:hover{background:rgba(0,255,204,0.2);transform:translateY(-3px)}
.tool-btn.gold{border-color:#ffcc00;color:#ffcc00}
.tool-btn.blue{border-color:#00aaff;color:#00aaff}
.tool-btn.purple{border-color:#aa00ff;color:#aa00ff}

#prophetsPanel,#topicPanel,#journeyPanel,#searchPanel,#favPanel,#prophetDetail{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);background:linear-gradient(135deg,#0a0a1e,#1a1a3a);border-radius:20px;padding:25px;width:600px;max-width:92%;max-height:85vh;overflow-y:auto;display:none;z-index:1000;opacity:0;transition:all .35s cubic-bezier(0.34,1.56,0.64,1)}
#prophetsPanel.show,#topicPanel.show,#journeyPanel.show,#searchPanel.show,#favPanel.show,#prophetDetail.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}
#prophetsPanel{border:2px solid #00ffcc;box-shadow:0 20px 60px rgba(0,255,204,0.3)}
#topicPanel{border:2px solid #ffcc00;box-shadow:0 20px 60px rgba(255,204,0,0.3)}
#journeyPanel{border:2px solid #00aaff;box-shadow:0 20px 60px rgba(0,170,255,0.3);text-align:center}
#searchPanel{border:2px solid #aa00ff;box-shadow:0 20px 60px rgba(170,0,255,0.3)}
#favPanel{border:2px solid #ffcc00;box-shadow:0 20px 60px rgba(255,204,0,0.3)}
#prophetDetail{border:2px solid #ffcc00;box-shadow:0 20px 60px rgba(255,204,0,0.3);z-index:1100}

.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;padding-bottom:12px;border-bottom:2px solid #ffffff22}
.panel-header h2{font-size:18px;font-weight:900}
#prophetsPanel .panel-header h2{color:#00ffcc}
#topicPanel .panel-header h2{color:#ffcc00}
#journeyPanel h2{color:#00aaff;font-size:22px;margin-bottom:10px}
#searchPanel .panel-header h2{color:#aa00ff}
#favPanel .panel-header h2{color:#ffcc00}
#prophetDetail .panel-header h2{color:#ffcc00}
.card-close{background:rgba(255,0,0,0.2);border:1px solid #ff3333;color:#ff3333;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px}

.prophet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.prophet-card{background:rgba(0,255,204,0.08);border:1px solid #00ffcc55;border-radius:12px;padding:12px;cursor:pointer;text-align:center;transition:.3s}
.prophet-card:hover{background:rgba(0,255,204,0.2);transform:translateY(-3px);border-color:#00ffcc}
.prophet-name{color:#ffcc00;font-size:15px;font-weight:900;margin-bottom:4px}
.prophet-count{color:#00ffcc;font-size:11px}

.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.topic-card{background:rgba(255,204,0,0.08);border:1px solid #ffcc0055;border-radius:10px;padding:10px;cursor:pointer;text-align:center;transition:.3s}
.topic-card:hover{background:rgba(255,204,0,0.2);transform:translateY(-3px)}
.topic-name{color:#ffcc00;font-size:14px;font-weight:900;margin-bottom:4px}
.topic-count{color:#00ffcc;font-size:11px}

.surah-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.surah-chip{background:rgba(0,255,204,0.1);border:1px solid #00ffcc55;padding:6px 12px;border-radius:15px;font-size:12px;color:#00ffcc;cursor:pointer;font-weight:700}
.surah-chip:hover{background:rgba(0,255,204,0.3)}

.journey-sub{color:#aaa;font-size:13px;margin-bottom:20px}
.journey-surah{font-size:50px;font-weight:900;color:#ffcc00;margin:20px 0;text-shadow:0 0 30px rgba(255,204,0,0.5)}
.journey-ayat{color:#00ffcc;font-size:14px;margin-bottom:20px}
.journey-ayah-text{background:rgba(255,204,0,0.08);border-right:4px solid #ffcc00;padding:20px;border-radius:12px;color:#fff;font-size:16px;line-height:2;margin:20px 0;text-align:center}
.journey-btns{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.jbtn{padding:12px 24px;border-radius:12px;border:none;font-family:'Tajawal',sans-serif;font-weight:700;font-size:14px;cursor:pointer}
.jbtn.primary{background:#00ffcc;color:#0a0a1a}
.jbtn.secondary{background:rgba(0,170,255,0.2);color:#00aaff;border:1px solid #00aaff}
.jbtn.danger{background:rgba(255,0,0,0.2);color:#ff3333;border:1px solid #ff3333}
.progress-bar{background:rgba(255,255,255,0.1);height:6px;border-radius:3px;overflow:hidden;margin:15px 0}
.progress-fill{background:linear-gradient(90deg,#00ffcc,#ffcc00);height:100%;transition:width .5s}

.search-input-box{display:flex;gap:8px;margin-bottom:15px}
.search-input-box input{flex:1;padding:12px;border-radius:10px;border:1px solid #aa00ff55;background:rgba(170,0,255,0.05);color:#fff;font-family:'Tajawal',sans-serif;outline:none;font-size:14px}
.search-go{padding:12px 20px;border-radius:10px;border:none;background:#aa00ff;color:#fff;font-weight:700;cursor:pointer;font-size:14px}
.results{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto}
.result-item{background:rgba(170,0,255,0.08);border-right:3px solid #aa00ff;padding:10px 12px;border-radius:8px;font-size:13px;line-height:1.8;cursor:pointer}
.result-surah{color:#ffcc00;font-weight:700;font-size:11px;margin-bottom:4px;display:block}

.fav-list{display:flex;flex-direction:column;gap:6px}
.fav-item{background:rgba(255,204,0,0.08);border:1px solid #ffcc0055;padding:10px 12px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.fav-name{color:#ffcc00;font-weight:700;font-size:14px}
.fav-remove{color:#ff3333;cursor:pointer;font-size:14px;padding:4px 8px}

#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:rgba(0,255,204,0.95);color:#0a0a1a;padding:12px 25px;border-radius:30px;font-weight:700;font-size:13px;z-index:5000;transition:transform .4s}
#toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:700px){
    #header h1{font-size:12px}
    .hbtn{padding:5px 8px;font-size:10px}
    #sidebar{width:240px}
    #sidebar.hidden{margin-right:-240px}
    #toolbar{bottom:75px;right:10px;max-width:70%}
    .tool-btn{padding:6px 9px;font-size:10px}
}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <button class="hbtn" onclick="toggleSidebar()">◀ القائمة</button>
    <h1>النظام العصبي للقرآن <span>| اللولب الثلاثي</span></h1>
    <div class="header-btns">
      <button class="hbtn purple" onclick="openSearchPanel()">🔍 البحث</button>
      <button class="hbtn gold" onclick="openFavPanel()">⭐ المفضلة</button>
    </div>
  </div>
  <div id="main">
    <div id="sidebar">
      <div class="side-tabs">
        <div class="side-tab active" onclick="switchTab('surahs',this)">السور</div>
        <div class="side-tab" onclick="switchTab('prophets',this)">الأنبياء</div>
        <div class="side-tab" onclick="switchTab('topics',this)">المواضيع</div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث...">
        <button onclick="searchSurah()">🔍</button>
      </div>
      <div id="sidebarContent"></div>
    </div>
    <div id="content">
      <div id="canvas-container"></div>
      <div id="infoPanel">
        <button class="close-btn" onclick="closeInfo()">✕</button>
        <div id="infoContent"></div>
      </div>
      <div id="ayahCard">
        <div class="card-header">
          <div class="card-title" id="cardTitle"></div>
          <button class="card-close" onclick="closeAyahCard()">✕</button>
        </div>
        <div class="relation-tag" id="cardRelation"></div>
        <div class="ayah-verse">
          <div class="ayah-text" id="cardAyah"></div>
          <span class="ayah-source" id="cardSource"></span>
        </div>
      </div>
      <div id="statsBar">
        <div class="stat-box c1" onclick="filterFamily(1)"><div class="num" id="stat1">0</div><div class="label">1-4-7</div></div>
        <div class="stat-box c2" onclick="filterFamily(2)"><div class="num" id="stat2">0</div><div class="label">2-5-8</div></div>
        <div class="stat-box c3" onclick="filterFamily(0)"><div class="num" id="stat3">0</div><div class="label">3-6-9</div></div>
      </div>
      <div id="toolbar"></div>
    </div>
  </div>
</div>

<div id="prophetsPanel">
  <div class="panel-header">
    <h2>🧕 الأنبياء المذكورون في القرآن</h2>
    <button class="card-close" onclick="closeProphetsPanel()">✕</button>
  </div>
  <div class="prophet-grid" id="prophetGrid"></div>
</div>

<div id="prophetDetail">
  <div class="panel-header">
    <h2 id="prophetDetailTitle"></h2>
    <button class="card-close" onclick="closeProphetDetail()">✕</button>
  </div>
  <div id="prophetDetailContent"></div>
</div>

<div id="topicPanel">
  <div class="panel-header">
    <h2>🎯 المسار الموضوعي</h2>
    <button class="card-close" onclick="closeTopicPanel()">✕</button>
  </div>
  <div class="topic-grid" id="topicGrid"></div>
</div>

<div id="journeyPanel">
  <h2>🚀 رحلة عبر القرآن</h2>
  <div class="journey-sub">انتقل تلقائياً بين سور القرآن الكريم</div>
  <div class="progress-bar"><div class="progress-fill" id="journeyProgress" style="width:0%"></div></div>
  <div class="journey-surah" id="journeySurah">—</div>
  <div class="journey-ayat" id="journeyAyat">—</div>
  <div class="journey-ayah-text" id="journeyAyahText">—</div>
  <div class="journey-btns">
    <button class="jbtn secondary" onclick="journeyPrev()">⏮ السابق</button>
    <button class="jbtn primary" onclick="journeyPlay()" id="journeyPlayBtn">▶ تشغيل</button>
    <button class="jbtn secondary" onclick="journeyNext()">التالي ⏭</button>
    <button class="jbtn danger" onclick="closeJourneyPanel()">إغلاق</button>
  </div>
</div>

<div id="searchPanel">
  <div class="panel-header">
    <h2>🔍 البحث الموضوعي</h2>
    <button class="card-close" onclick="closeSearchPanel()">✕</button>
  </div>
  <div class="search-input-box">
    <input type="text" id="topicSearchInput" placeholder="اكتب موضوعاً مثل: الصبر، التوحيد...">
    <button class="search-go" onclick="doTopicSearch()">ابحث</button>
  </div>
  <div class="results" id="searchResults"></div>
</div>

<div id="favPanel">
  <div class="panel-header">
    <h2>⭐ السور المفضلة</h2>
    <button class="card-close" onclick="closeFavPanel()">✕</button>
  </div>
  <div class="fav-list" id="favList"></div>
</div>

<div id="toast">تم الحفظ</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>

const ayahMuhammad={2:"﴿آمَنَ الرَّسُولُ بِمَا أُنزِلَ إِلَيْهِ مِن رَّبِّهِ وَالْمُؤْمِنُونَ﴾ (البقرة: 285)",3:"﴿وَمَا مُحَمَّدٌ إِلَّا رَسُولٌ قَدْ خَلَتْ مِن قَبْلِهِ الرُّسُلُ﴾ (آل عمران: 144)",4:"﴿أَطِيعُوا اللَّهَ وَأَطِيعُوا الرَّسُولَ﴾ (النساء: 59)",5:"﴿يَا أَيُّهَا الرَّسُولُ بَلِّغْ مَا أُنزِلَ إِلَيْكَ مِن رَّبِّكَ﴾ (المائدة: 67)",7:"﴿قُلْ يَا أَيُّهَا النَّاسُ إِنِّي رَسُولُ اللَّهِ إِلَيْكُمْ جَمِيعًا﴾ (الأعراف: 158)",8:"﴿يَا أَيُّهَا النَّبِيُّ حَسْبُكَ اللَّهُ وَمَنِ اتَّبَعَكَ مِنَ الْمُؤْمِنِينَ﴾ (الأنفال: 64)",9:"﴿لَقَدْ جَاءَكُمْ رَسُولٌ مِّنْ أَنفُسِكُمْ عَزِيزٌ عَلَيْهِ مَا عَنِتُّمْ﴾ (التوبة: 128)",21:"﴿وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ﴾ (الأنبياء: 107)",24:"﴿وَأَطِيعُوا الرَّسُولَ لَعَلَّكُمْ تُرْحَمُونَ﴾ (النور: 56)",33:"﴿يَا أَيُّهَا النَّبِيُّ إِنَّا أَرْسَلْنَاكَ شَاهِدًا وَمُبَشِّرًا وَنَذِيرًا﴾ (الأحزاب: 45)",36:"﴿يس وَالْقُرْآنِ الْحَكِيمِ إِنَّكَ لَمِنَ الْمُرْسَلِينَ﴾ (يس: 1-3)",47:"﴿وَالَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ فَلَنْ يُضِلَّ أَعْمَالَهُمْ﴾ (محمد: 4)",48:"﴿إِنَّا أَرْسَلْنَاكَ شَاهِدًا وَمُبَشِّرًا وَنَذِيرًا﴾ (الفتح: 8)",49:"﴿لَا تُقَدِّمُوا بَيْنَ يَدَيِ اللَّهِ وَرَسُولِهِ﴾ (الحجرات: 1)",53:"﴿وَمَا يَنطِقُ عَنِ الْهَوَىٰ إِنْ هُوَ إِلَّا وَحْيٌ يُوحَىٰ﴾ (النجم: 3-4)",68:"﴿وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٍ﴾ (القلم: 4)",93:"﴿مَا وَدَّعَكَ رَبُّكَ وَمَا قَلَىٰ﴾ (الضحى: 3)",94:"﴿وَرَفَعْنَا لَكَ ذِكْرَكَ﴾ (الشرح: 4)",108:"﴿إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ﴾ (الكوثر: 1)",110:"﴿إِذَا جَاءَ نَصْرُ اللَّهِ وَالْفَتْحُ﴾ (النصر: 1)"};
const ayahIbrahim={2:"﴿وَإِذْ جَعَلْنَا الْبَيْتَ مَثَابَةً لِّلنَّاسِ وَأَمْنًا وَاتَّخِذُوا مِن مَّقَامِ إِبْرَاهِيمَ مُصَلًّى﴾ (البقرة: 125)",3:"﴿إِنَّ أَوْلَى النَّاسِ بِإِبْرَاهِيمَ لَلَّذِينَ اتَّبَعُوهُ﴾ (آل عمران: 68)",6:"﴿وَإِذْ قَالَ إِبْرَاهِيمُ لِأَبِيهِ آزَرَ أَتَتَّخِذُ أَصْنَامًا آلِهَةً﴾ (الأنعام: 74)",14:"﴿وَإِذْ قَالَ إِبْرَاهِيمُ رَبِّ اجْعَلْ هَٰذَا الْبَلَدَ آمِنًا﴾ (إبراهيم: 35)",16:"﴿إِنَّ إِبْرَاهِيمَ كَانَ أُمَّةً قَانِتًا لِّلَّهِ حَنِيفًا﴾ (النحل: 120)",21:"﴿وَإِبْرَاهِيمَ إِذْ قَالَ لِقَوْمِهِ اعْبُدُوا اللَّهَ وَاتَّقُوهُ﴾ (العنكبوت: 16)",22:"﴿وَإِذْ بَوَّأْنَا لِإِبْرَاهِيمَ مَكَانَ الْبَيْتِ﴾ (الحج: 26)",26:"﴿وَاتْلُ عَلَيْهِمْ نَبَأَ إِبْرَاهِيمَ﴾ (الشعراء: 69)",37:"﴿وَإِنَّ مِن شِيعَتِهِ لَإِبْرَاهِيمَ﴾ (الصافات: 83)",60:"﴿قَدْ كَانَتْ لَكُمْ أُسْوَةٌ حَسَنَةٌ فِي إِبْرَاهِيمَ﴾ (الممتحنة: 4)",87:"﴿صُحُفِ إِبْرَاهِيمَ وَمُوسَىٰ﴾ (الأعلى: 19)",106:"﴿فَلْيَعْبُدُوا رَبَّ هَٰذَا الْبَيْتِ﴾ (قريش: 3)"};
const ayahMusa={2:"﴿وَإِذْ آتَيْنَا مُوسَى الْكِتَابَ وَالْفُرْقَانَ﴾ (البقرة: 53)",7:"﴿ثُمَّ بَعَثْنَا مِن بَعْدِهِم مُّوسَى بِآيَاتِنَا﴾ (الأعراف: 103)",17:"﴿وَلَقَدْ آتَيْنَا مُوسَى تِسْعَ آيَاتٍ بَيِّنَاتٍ﴾ (الإسراء: 101)",18:"﴿وَإِذْ قَالَ مُوسَى لِفَتَاهُ﴾ (الكهف: 60)",20:"﴿وَهَلْ أَتَاكَ حَدِيثُ مُوسَىٰ﴾ (طه: 9)",23:"﴿ثُمَّ أَرْسَلْنَا مُوسَى وَأَخَاهُ هَارُونَ﴾ (المؤمنون: 45)",25:"﴿وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ وَجَعَلْنَا مَعَهُ أَخَاهُ هَارُونَ وَزِيرًا﴾ (الفرقان: 35)",26:"﴿إِذْ قَالَ مُوسَى لِأَهْلِهِ إِنِّي آنَسْتُ نَارًا﴾ (النمل: 7)",28:"﴿وَلَقَدْ آتَيْنَا مُوسَى الْكِتَابَ﴾ (القصص: 43)",32:"﴿وَلَقَدْ آتَيْنَا مُوسَى الْهُدَىٰ﴾ (غافر: 53)",40:"﴿وَلَقَدْ أَرْسَلْنَا مُوسَى بِآيَاتِنَا وَسُلْطَانٍ مُّبِينٍ﴾ (هود: 96)",44:"﴿وَلَقَدْ فَتَنَّا قَبْلَهُمْ قَوْمَ فِرْعَوْنَ﴾ (الدخان: 17)",79:"﴿هَلْ أَتَاكَ حَدِيثُ مُوسَىٰ﴾ (النازعات: 15)"};
const ayahIsa={2:"﴿وَآتَيْنَا عِيسَى ابْنَ مَرْيَمَ الْبَيِّنَاتِ وَأَيَّدْنَاهُ بِرُوحِ الْقُدُسِ﴾ (البقرة: 87)",3:"﴿إِنَّ اللَّهَ يُبَشِّرُكِ بِكَلِمَةٍ مِّنْهُ اسْمُهُ الْمَسِيحُ عِيسَى ابْنُ مَرْيَمَ﴾ (آل عمران: 45)",4:"﴿وَقَوْلِهِمْ إِنَّا قَتَلْنَا الْمَسِيحَ عِيسَى ابْنَ مَرْيَمَ﴾ (النساء: 157)",5:"﴿وَقَفَّيْنَا بِعِيسَى ابْنِ مَرْيَمَ وَآتَيْنَاهُ الْإِنجِيلَ﴾ (المائدة: 46)",19:"﴿قَالَ إِنِّي عَبْدُ اللَّهِ آتَانِيَ الْكِتَابَ وَجَعَلَنِي نَبِيًّا﴾ (مريم: 30)",21:"﴿وَجَعَلْنَاهُ وَأُمَّهُ آيَةً لِّلْعَالَمِينَ﴾ (الأنبياء: 91)",23:"﴿وَجَعَلْنَا ابْنَ مَرْيَمَ وَأُمَّهُ آيَةً﴾ (المؤمنون: 50)",43:"﴿وَلَمَّا جَاءَ عِيسَىٰ بِالْبَيِّنَاتِ﴾ (الزخرف: 63)",57:"﴿وَقَفَّيْنَا عَلَىٰ آثَارِهِم بِعِيسَى ابْنِ مَرْيَمَ﴾ (الحديد: 27)",61:"﴿وَمُبَشِّرًا بِرَسُولٍ يَأْتِي مِن بَعْدِي اسْمُهُ أَحْمَدُ﴾ (الصف: 6)"};
const ayahYusuf={2:"﴿وَنَعْلَمُ مَا تُخْفِي صُدُورُهُمْ﴾ (البقرة: 77)",6:"﴿وَوَهَبْنَا لَهُ إِسْحَاقَ وَيَعْقُوبَ﴾ (الأنعام: 84)",11:"﴿وَكُلًّا نَّقُصُّ عَلَيْكَ مِنْ أَنبَاءِ الرُّسُلِ﴾ (هود: 120)",12:"﴿وَكَذَٰلِكَ مَكَّنَّا لِيُوسُفَ فِي الْأَرْضِ﴾ (يوسف: 56)",40:"﴿وَيُوسُفُ نَجِّنِي مِنَ السِّجْنِ﴾ (يوسف: 101)"};
const ayahNuh={7:"﴿وَنُوحًا إِذْ نَادَىٰ مِن قَبْلُ فَاسْتَجَبْنَا لَهُ﴾ (الأنبياء: 76)",11:"﴿وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ﴾ (هود: 25)",21:"﴿وَنُوحًا إِذْ نَادَىٰ مِن قَبْلُ﴾ (الأنبياء: 76)",26:"﴿وَلَقَدْ أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ﴾ (هود: 25)",54:"﴿كَذَّبَتْ قَبْلَهُمْ قَوْمُ نُوحٍ﴾ (القمر: 9)",57:"﴿وَلَقَدْ أَرْسَلْنَا نُوحًا وَإِبْرَاهِيمَ﴾ (الحديد: 26)",71:"﴿إِنَّا أَرْسَلْنَا نُوحًا إِلَىٰ قَوْمِهِ﴾ (نوح: 1)"};

const ayahGeneral={1:"﴿إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ﴾ (الفاتحة: 5)",2:"﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ﴾ (البقرة: 45)",3:"﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اصْبِرُوا وَصَابِرُوا﴾ (آل عمران: 200)",4:"﴿إِنَّ اللَّهَ يَأْمُرُ بِالْعَدْلِ وَالْإِحْسَانِ﴾ (النحل: 90)",5:"﴿أَوْفُوا بِالْعُقُودِ﴾ (المائدة: 1)",6:"﴿قُلْ إِنَّنِي هَدَانِي رَبِّي إِلَىٰ صِرَاطٍ مُّسْتَقِيمٍ﴾ (الأنعام: 161)",7:"﴿وَأَصْبِرْ حَتَّىٰ يَحْكُمَ اللَّهُ﴾ (يونس: 109)",8:"﴿وَمَا النَّصْرُ إِلَّا مِنْ عِندِ اللَّهِ﴾ (الأنفال: 10)",9:"﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ﴾ (البقرة: 222)",10:"﴿وَاصْبِرْ حَتَّىٰ يَحْكُمَ اللَّهُ﴾ (يونس: 109)",11:"﴿وَاسْتَغْفِرُوا رَبَّكُمْ ثُمَّ تُوبُوا إِلَيْهِ﴾ (هود: 3)",12:"﴿وَكَذَٰلِكَ مَكَّنَّا لِيُوسُفَ﴾ (يوسف: 56)",13:"﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾ (الرعد: 28)",14:"﴿لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ﴾ (إبراهيم: 7)",15:"﴿وَإِن مِّن شَيْءٍ إِلَّا عِندَنَا خَزَائِنُهُ﴾ (الحجر: 21)",16:"﴿وَاصْبِرْ وَمَا صَبْرُكَ إِلَّا بِاللَّهِ﴾ (النحل: 127)",17:"﴿وَبِالْوَالِدَيْنِ إِحْسَانًا﴾ (الإسراء: 23)",18:"﴿وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم﴾ (الكهف: 28)",19:"﴿وَاذْكُرْ فِي الْكِتَابِ مَرْيَمَ﴾ (مريم: 16)",20:"﴿إِنَّنِي أَنَا اللَّهُ لَا إِلَٰهَ إِلَّا أَنَا فَاعْبُدْنِي﴾ (طه: 14)",21:"﴿وَمَا أَرْسَلْنَاكَ إِلَّا رَحْمَةً لِّلْعَالَمِينَ﴾ (الأنبياء: 107)",22:"﴿وَجَاهِدُوا فِي اللَّهِ حَقَّ جِهَادِهِ﴾ (الحج: 78)",23:"﴿قَدْ أَفْلَحَ الْمُؤْمِنُونَ﴾ (المؤمنون: 1)",24:"﴿اللَّهُ نُورُ السَّمَاوَاتِ وَالْأَرْضِ﴾ (النور: 35)",25:"﴿تَبَارَكَ الَّذِي نَزَّلَ الْفُرْقَانَ عَلَىٰ عَبْدِهِ﴾ (الفرقان: 1)",26:"﴿وَاتْلُ عَلَيْهِمْ نَبَأَ إِبْرَاهِيمَ﴾ (الشعراء: 69)",27:"﴿قَالَ هَٰذَا مِن فَضْلِ رَبِّي﴾ (النمل: 40)",28:"﴿وَنُرِيدُ أَن نَّمُنَّ عَلَى الَّذِينَ اسْتُضْعِفُوا﴾ (القصص: 5)",29:"﴿أَحَسِبَ النَّاسُ أَن يُتْرَكُوا﴾ (العنكبوت: 2)",30:"﴿فَأَقِمْ وَجْهَكَ لِلدِّينِ حَنِيفًا﴾ (الروم: 30)",31:"﴿وَلَقَدْ آتَيْنَا لُقْمَانَ الْحِكْمَةَ﴾ (لقمان: 12)",32:"﴿إِنَّمَا يُؤْمِنُ بِآيَاتِنَا الَّذِينَ إِذَا ذُكِّرُوا بِهَا خَرُّوا سُجَّدًا﴾ (السجدة: 15)",33:"﴿إِنَّا عَرَضْنَا الْأَمَانَةَ عَلَى السَّمَاوَاتِ وَالْأَرْضِ﴾ (الأحزاب: 72)",34:"﴿وَقَلِيلٌ مِّنْ عِبَادِيَ الشَّكُورُ﴾ (سبأ: 13)",35:"﴿يَا أَيُّهَا النَّاسُ أَنتُمُ الْفُقَرَاءُ إِلَى اللَّهِ﴾ (فاطر: 15)",36:"﴿وَضَرَبَ لَنَا مَثَلًا وَنَسِيَ خَلْقَهُ﴾ (يس: 78)",37:"﴿وَإِنَّ مِن شِيعَتِهِ لَإِبْرَاهِيمَ﴾ (الصافات: 83)",38:"﴿وَاذْكُرْ عَبْدَنَا أَيُّوبَ إِذْ نَادَىٰ رَبَّهُ﴾ (ص: 41)",39:"﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا﴾ (الزمر: 53)",40:"﴿فَاصْبِرْ إِنَّ وَعْدَ اللَّهِ حَقٌّ﴾ (غافر: 55)",41:"﴿وَمَنْ أَحْسَنُ قَوْلًا مِّمَّن دَعَا إِلَى اللَّهِ﴾ (فصلت: 33)",42:"﴿وَأَمْرُهُمْ شُورَىٰ بَيْنَهُمْ﴾ (الشورى: 38)",43:"﴿وَلَئِن سَأَلْتَهُم مَّنْ خَلَقَ السَّمَاوَاتِ وَالْأَرْضَ﴾ (الزخرف: 9)",44:"﴿فَارْتَقِبْ يَوْمَ تَأْتِي السَّمَاءُ بِدُخَانٍ مُّبِينٍ﴾ (الدخان: 10)",45:"﴿وَلِلَّهِ مُلْكُ السَّمَاوَاتِ وَالْأَرْضِ﴾ (الجاثية: 27)",46:"﴿فَاصْبِرْ كَمَا صَبَرَ أُولُو الْعَزْمِ مِنَ الرُّسُلِ﴾ (الأحقاف: 35)",47:"﴿وَالَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ فَلَنْ يُضِلَّ أَعْمَالَهُمْ﴾ (محمد: 4)",48:"﴿إِنَّا فَتَحْنَا لَكَ فَتْحًا مُّبِينًا﴾ (الفتح: 1)",49:"﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ﴾ (الحجرات: 10)",50:"﴿وَنُفِخَ فِي الصُّورِ ذَٰلِكَ يَوْمُ الْوَعِيدِ﴾ (ق: 20)",51:"﴿وَفِي السَّمَاءِ رِزْقُكُمْ وَمَا تُوعَدُونَ﴾ (الذاريات: 22)",52:"﴿وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا﴾ (الطور: 48)",53:"﴿وَمَا يَنطِقُ عَنِ الْهَوَىٰ﴾ (النجم: 3)",54:"﴿وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ﴾ (القمر: 17)",55:"﴿الرَّحْمَٰنُ عَلَّمَ الْقُرْآنَ﴾ (الرحمن: 1-2)",56:"﴿فَسَبِّحْ بِاسْمِ رَبِّكَ الْعَظِيمِ﴾ (الواقعة: 74)",57:"﴿هُوَ الْأَوَّلُ وَالْآخِرُ وَالظَّاهِرُ وَالْبَاطِنُ﴾ (الحديد: 3)",58:"﴿اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ﴾ (المجادلة: 1)",59:"﴿هُوَ اللَّهُ الَّذِي لَا إِلَٰهَ إِلَّا هُوَ﴾ (الحشر: 22)",60:"﴿رَبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا﴾ (الممتحنة: 4)",61:"﴿وَاللَّهُ مُتِمُّ نُورِهِ وَلَوْ كَرِهَ الْكَافِرُونَ﴾ (الصف: 8)",62:"﴿وَاذْكُرُوا اللَّهَ كَثِيرًا لَّعَلَّكُمْ تُفْلِحُونَ﴾ (الجمعة: 10)",63:"﴿وَلِلَ function getAyah(surahIndex,motherIndex){
    const axis=surahAxis[motherIndex]||'';
    if(axis.includes('محمد')&&ayahMuhammad[surahIndex])return ayahMuhammad[surahIndex];
    if(axis.includes('إبراهيم')&&ayahIbrahim[surahIndex])return ayahIbrahim[surahIndex];
    if(axis.includes('موسى')&&ayahMusa[surahIndex])return ayahMusa[surahIndex];
    if(axis.includes('عيسى')&&ayahIsa[surahIndex])return ayahIsa[surahIndex];
    if(axis.includes('يوسف')&&ayahYusuf[surahIndex])return ayahYusuf[surahIndex];
    if(axis.includes('نوح')&&ayahNuh[surahIndex])return ayahNuh[surahIndex];
    return ayahGeneral[surahIndex]||'﴿آية من السورة﴾';
}

const families={0:[],1:[],2:[]};
const nodeData=[];
surahsData.forEach((s,i)=>{
    const index=i+1;
    const sum=index+s[1];
    const fam=sum%3;
    const n={index,name:s[0],ayat:s[1],topics:s[2],fam,sum};
    families[fam].push(n);
    nodeData.push(n)
});
document.getElementById('stat1').innerText=families[1].length;

function launchShootingStar(star){
    const sx=(Math.random()-0.5)*150;
    const sy=60+Math.random()*40;
    const sz=(Math.random()-0.5)*150;
    star.userData={active:true,timer:0,duration:0,duration_max:1.2,sx,sy,sz,tx:sx-60-Math.random()*30,ty:sy-60-Math.random()*20,tz:sz};
    star.material.opacity=1;
}

function updateShootingStars(dt){
    shootingStars.forEach(star=>{
        const u=star.userData;
        if(!u.active){
            u.timer-=dt;
            if(u.timer<=0){launchShootingStar(star);u.timer=3+Math.random()*5;}
            return;
        }
        u.duration+=dt;
        const t=u.duration/u.duration_max;
        if(t>=1){u.active=false;star.material.opacity=0;return;}
        const pos=star.geometry.attributes.position.array;
        pos[0]=u.sx+(u.tx-u.sx)*t;
        pos[1]=u.sy+(u.ty-u.sy)*t;
        pos[2]=u.sz+(u.tz-u.sz)*t;
        pos[3]=pos[0]+20;
        pos[4]=pos[1]+20;
        pos[5]=pos[2];
        star.geometry.attributes.position.needsUpdate=true;
        star.material.opacity=1-t;
    });
}

let relationsVisible=false;

function clearRelations(){
    while(relationGroup.children.length>0){
        relationGroup.remove(relationGroup.children[0]);
    }
}

function buildRelations(){
    clearRelations();
    // نجمع المواضع الحالية للعقد (محلية داخل dnaGroup)
    const nodePos={};
    nodeMeshes.forEach(n=>{nodePos[n.userData.index]=n.position.clone();});
    
    nodeData.forEach((s1,i)=>{
        nodeData.forEach((s2,j)=>{
            if(j<=i)return;
            const shared=s1.topics.filter(t=>s2.topics.includes(t));
            if(shared.length>=3){ // 3 مواضيع أو أكثر
                const p1=nodePos[s1.index];
                const p2=nodePos[s2.index];
                if(p1&&p2){
                    const geo=new THREE.BufferGeometry().setFromPoints([p1,p2]);
                    const mat=new THREE.LineBasicMaterial({
                        color:0xaa00ff,
                        transparent:true,
                        opacity:0.08+shared.length*0.03,
                        blending:THREE.AdditiveBlending,
                        depthWrite:false
                    });
                    relationGroup.add(new THREE.Line(geo,mat));
                }
            }
        });
    });
    console.log('🕸️ عدد الخطوط:',relationGroup.children.length);
}

function toggleRelations(){
    relationsVisible=!relationsVisible;
    if(relationsVisible){
        buildRelations();
        // تحريك الكاميرا لرؤية الحلقة
        setTimeout(()=>{targetRotX=-0.85;zoom=105;},100);
        showToast('🕸️ عرض الحلقة من الأعلى');
    } else {
        clearRelations();
        targetRotX=0;zoom=90;
        showToast('🕸️ تم الإخفاء');
    }
}

function showAyahCard(surahIndex,motherAxis,motherIndex,isFamily){
    const card=document.getElementById('ayahCard');
    const surah=nodeData[surahIndex-1];
    const ayahText=getAyah(surahIndex,motherIndex);
    let text=ayahText,source='';
    const m=ayahText.match(/\(([^)]+)\)\s*$/);
    if(m){source=m[1];text=ayahText.replace(/\s*\([^)]+\)\s*$/,'').trim();}
    document.getElementById('cardTitle').innerText=surahIndex+'. '+surah.name;
    document.getElementById('cardRelation').className=isFamily?'relation-tag':'relation-tag blue';
    document.getElementById('cardRelation').innerText=(isFamily?'◆ من نفس العائلة':'◆ موضوع مشترك')+' | محور: '+motherAxis;
    document.getElementById('cardAyah').innerText=text;
    document.getElementById('cardSource').innerText='📖 '+source;
    card.classList.add('show');
}

function focusOnSurah(index){
    const node=nodeMeshes.find(n=>n.userData.index===index);
    if(!node)return;
    dnaGroup.children.forEach(c=>{if(c.userData.fam!==undefined)c.visible=true;});
    const wp=new THREE.Vector3();
    node.getWorldPosition(wp);
    const angle=Math.atan2(wp.x,wp.z);
    targetRotY=-angle+Math.PI;
    targetRotX=-0.3;
    zoom=50;
}

function searchSurah(){
    const q=document.getElementById('searchInput').value.trim();
    if(!q)return;
    const m=nodeData.find(d=>d.name.includes(q)||d.index.toString()===q);
    if(m){focusOnSurah(m.index);showSurahInfo(m);}
    else{alert('لم يتم العثور على السورة');}
}

        c.innerHTML='<div style="color:#ffcc00;font-size:12px;text-align:center;margin-bottom:10px">◆ انقر على موضوع ◆</div>';
        allTopics.forEach(t=>{

            div.className='surah-item';
            div.style.borderColor='#aa00ff';
            div.innerHTML=`<span>🎯 ${t}</span><span class="ayat">${count} سورة</span>`;
            div.onclick=()=>openTopicDetail(t);
            c.appendChild(div);
        });
    }
}

        showToast('تم الحفظ ⭐');
    }
    localStorage.setItem('quranFavorites',JSON.stringify(favorites));
}
function openFavPanel(){
    document.getElementById('favPanel').classList.add('show');
    const list=document.getElementById('favList');
    if(favorites.length===0){
        list.innerHTML='<div style="text-align:center;color:#888;padding:30px">لا توجد سور محفوظة<br>انقر على ☆ بجانب أي سورة</div>';
        return;
    }
    list.innerHTML='';
    favorites.sort((a,b)=>a-b).forEach(idx=>{
        const s=nodeData[idx-1];
        const div=document.createElement('div');
        div.className='fav-item';
        div.innerHTML=`<span class="fav-name">${s.index}. ${s.name}</span><span class="fav-remove" onclick="event.stopPropagation();removeFav(${idx})">🗑</span>`;
        div.onclick=()=>{closeFavPanel();focusOnSurah(s.index);showSurahInfo(s);};
        list.appendChild(div);
    });
}
function removeFav(idx){
    favorites=favorites.filter(i=>i!==idx);
    localStorage.setItem('quranFavorites',JSON.stringify(favorites));
    openFavPanel();
    renderSidebar();
    showToast('تم الحذف');
}
function closeFavPanel(){document.getElementById('favPanel').classList.remove('show');}

// الأنبياء
function openProphetsPanel(){
    document.getElementById('prophetsPanel').classList.add('show');
    const grid=document.getElementById('prophetGrid');
    grid.innerHTML='';
    Object.keys(prophetsData).forEach(p=>{
        const card=document.createElement('div');
        card.className='prophet-card';
        card.innerHTML=`<div class="prophet-name">${p}</div><div class="prophet-count">${prophetsData[p].surahs.length} سورة</div>`;
        card.onclick=()=>{closeProphetsPanel();openProphetDetail(p);};
        grid.appendChild(card);
    });
}
function closeProphetsPanel(){document.getElementById('prophetsPanel').classList.remove('show');}

function openProphetDetail(prophetName){
    const data=prophetsData[prophetName];
    if(!data)return;
    const panel=document.getElementById('prophetDetail');
    document.getElementById('prophetDetailTitle').innerText='🧕 '+prophetName+' عليه السلام';
    const content=document.getElementById('prophetDetailContent');
    content.innerHTML=`
        <div style="color:#00ffcc;font-size:13px;margin-bottom:15px;text-align:center">
            ذُكر في <b style="color:#ffcc00;font-size:16px">${data.surahs.length}</b> سورة
        </div>
        <div class="surah-list">
            ${data.surahs.map(idx=>{
                const s=nodeData[idx-1];
                return `<span class="surah-chip" onclick="closeProphetDetail();focusOnSurah(${idx});showSurahInfo(nodeData[${idx-1}])">${idx}. ${s.name}</span>`;
            }).join('')}
        </div>
    `;
    panel.classList.add('show');
}
function closeProphetDetail(){document.getElementById('prophetDetail').classList.remove('show');}

// المواضيع
function openTopicPanel(){
    document.getElementById('topicPanel').classList.add('show');
    const grid=document.getElementById('topicGrid');
    grid.innerHTML='';
    allTopics.forEach(t=>{
        const count=nodeData.filter(d=>d.topics.includes(t)).length;
        if(count===0)return;
        const card=document.createElement('div');
        card.className='topic-card';
        card.innerHTML=`<div class="topic-name">${t}</div><div class="topic-count">${count} سورة</div>`;
        card.onclick=()=>{closeTopicPanel();openTopicDetail(t);};
        grid.appendChild(card);
    });
}
function closeTopicPanel(){document.getElementById('topicPanel').classList.remove('show');}

function openTopicDetail(topicName){
    const surahs=nodeData.filter(d=>d.topics.includes(topicName));
    const panel=document.getElementById('prophetDetail');
    document.getElementById('prophetDetailTitle').innerText='🎯 '+topicName;
    const content=document.getElementById('prophetDetailContent');
    content.innerHTML=`
        <div style="color:#00ffcc;font-size:13px;margin-bottom:15px;text-align:center">
            موضوع <b style="color:#ffcc00;font-size:16px">${topicName}</b> في <b style="color:#ffcc00;font-size:16px">${surahs.length}</b> سورة
        </div>
        <div class="surah-list">
            ${surahs.map(s=>`<span class="surah-chip" onclick="closeProphetDetail();focusOnSurah(${s.index});showSurahInfo(nodeData[${s.index-1}])">${s.index}. ${s.name}</span>`).join('')}
        </div>
    `;
    panel.classList.add('show');
}

// البحث
function openSearchPanel(){
    document.getElementById('searchPanel').classList.add('show');
    document.getElementById('topicSearchInput').focus();
}
function closeSearchPanel(){document.getElementById('searchPanel').classList.remove('show');}
function doTopicSearch(){
    const q=document.getElementById('topicSearchInput').value.trim();
    const results=document.getElementById('searchResults');
    if(!q){results.innerHTML='<div style="text-align:center;color:#888;padding:20px">اكتب كلمة</div>';return;}
    const found=[];
    nodeData.forEach(s=>{s.topics.forEach(t=>{if(t.includes(q))found.push({surah:s,topic:t});});});
    if(found.length===0){results.innerHTML='<div style="text-align:center;color:#888;padding:20px">لا نتائج</div>';return;}
    results.innerHTML=found.map(f=>`
        <div class="result-item" onclick="closeSearchPanel();focusOnSurah(${f.surah.index});showSurahInfo(nodeData[${f.surah.index-1}])">
            <span class="result-surah">${f.surah.index}. ${f.surah.name}</span>
            الموضوع: <b style="color:#aa00ff">${f.topic}</b>
        </div>
    `).join('');
}

// الرحلة
let journeyIndex=0,journeyPlaying=false,journeyTimer=null;
function openJourneyPanel(){document.getElementById('journeyPanel').classList.add('show');journeyIndex=0;updateJourneyView();}
function closeJourneyPanel(){document.getElementById('journeyPanel').classList.remove('show');if(journeyPlaying)journeyPlay();}
function updateJourneyView(){
    const s=nodeData[journeyIndex];
    if(!s)return;
    document.getElementById('journeySurah').innerText=s.index+'. '+s.name;
    document.getElementById('journeyAyat').innerText=s.ayat+' آية | '+(s.fam===0?'3-6-9':s.fam===1?'1-4-7':'2-5-8');
    document.getElementById('journeyAyahText').innerText=ayahGeneral[s.index]||'—';
    document.getElementById('journeyProgress').style.width=((journeyIndex+1)/nodeData.length*100)+'%';
    focusOnSurah(s.index);
}
function journeyNext(){if(journeyIndex<nodeData.length-1){journeyIndex++;updateJourneyView();}}
function journeyPrev(){if(journeyIndex>0){journeyIndex--;updateJourneyView();}}
function journeyPlay(){
    journeyPlaying=!journeyPlaying;
    const btn=document.getElementById('journeyPlayBtn');
    if(journeyPlaying){
        btn.innerText='⏸ إيقاف';
        journeyTimer=setInterval(()=>{
            if(journeyIndex<nodeData.length-1){journeyIndex++;updateJourneyView();}
            else{journeyPlay();}
        },3500);
    } else {
        btn.innerText='▶ تشغيل';
        if(journeyTimer)clearInterval(journeyTimer);
    }
}

// إشعار
function showToast(msg){
    const t=document.getElementById('toast');
    t.innerText=msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2000);
}

// مستمعين
document.getElementById('searchInput').addEventListener('keypress',e=>{if(e.key==='Enter')searchSurah();});
document.getElementById('topicSearchInput').addEventListener('keypress',e=>{if(e.key==='Enter')doTopicSearch();});
document.addEventListener('click',(e)=>{
    const panels=['prophetsPanel','topicPanel','journeyPanel','searchPanel','favPanel','prophetDetail'];
    panels.forEach(id=>{
        const p=document.getElementById(id);
        if(p&&p.classList.contains('show')&&e.target===p)p.classList.remove('show');
    });
});
document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'){
        ['prophetsPanel','topicPanel','journeyPanel','searchPanel','favPanel','prophetDetail','ayahCard','infoPanel'].forEach(id=>{
            const p=document.getElementById(id);
            if(p){p.classList.remove('show');p.style.display='none';}
        });
    }
});

// حلقة الرسم
let time=0;
let lastTime=performance.now();
function animate(){
    requestAnimationFrame(animate);
    const now=performance.now();
    const dt=Math.min((now-lastTime)/1000,0.1);
    lastTime=now;
    time+=0.01;
    
    currentRotY+=(targetRotY-currentRotY)*0.08;
    currentRotX+=(targetRotX-currentRotX)*0.08;
    if(!isDragging&&!isTouching)targetRotY+=0.0015;
    dnaGroup.rotation.y=currentRotY;
    dnaGroup.rotation.x=currentRotX;
    camera.position.z=zoom;
    
    const pulse=1+Math.sin(time*2)*0.08;
    heartSphere.scale.set(pulse,pulse,pulse);
    heartSphere.material.emissiveIntensity=3+Math.sin(time*2)*1;
    halo.rotation.y+=0.002;
    halo2.rotation.y-=0.001;
    halo2.rotation.x+=0.001;
    rings.forEach((ring,i)=>{
        ring.rotation.z+=ring.userData.speed;
        ring.rotation.x=Math.PI/2+Math.sin(time+i)*0.2;
    });
    
    const pos=particleGeo.attributes.position.array;
    for(let i=0;i<particleCount;i++){
        const v=particleVel[i];
        v.theta+=v.speed;
        pos[i*3]=v.radius*Math.sin(v.phi)*Math.cos(v.theta);
        pos[i*3+1]=v.radius*Math.sin(v.phi)*Math.sin(v.theta);
        pos[i*3+2]=v.radius*Math.cos(v.phi);
    }
    particleGeo.attributes.position.needsUpdate=true;
    
    updateShootingStars(dt);
    
    renderer.render(scene,camera);
}
animate();

window.addEventListener('resize',()=>{
    const w=container.clientWidth,h=container.clientHeight;
    camera.aspect=w/h;
    camera.updateProjectionMatrix();
    renderer.setSize(w,h);
});

showToast('✨ النظام جاهز');
